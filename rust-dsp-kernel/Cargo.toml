[package]
name = "pulmo-dsp-kernel"
version = "1.0.0"
edition = "2021"
description = "PULMO-WAVE Rust DSP Kernel — Acoustic Flow-Volume Integration, Autocorrelation Pitch, Jitter/Shimmer/HNR"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = 3
lto = true
