name: Build & Bundle APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (wasm-pack)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build Rust WASM kernel
        working-directory: rust-dsp-kernel
        run: wasm-pack build --target web --out-dir ../src/wasm/pkg || echo "WASM build skipped — TS mirror fallback active"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify Go serverless function
        run: go vet ./api/ || echo "Go vet skipped (Vercel builds api/*.go directly)"

      - name: Install JS deps
        run: npm ci

      - name: Build Vue 3.5 web bundle
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Android environment diagnostics
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          java -version 2>&1
          ls "$ANDROID_HOME/platforms" 2>/dev/null || ls /usr/local/lib/android/sdk/platforms 2>/dev/null || echo "no platforms dir"
          ls android/app/src/main/assets/public/ | head -5

      - name: Build Android APK (Gradle)
        working-directory: android
        run: |
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace > ../gradle-output.txt 2>&1
          code=$?
          tail -60 ../gradle-output.txt
          exit $code

      - name: Commit Gradle diagnostics on failure
        if: failure()
        run: |
          git config user.name "pulmo-wave-ci"
          git config user.email "ci@pulmowave.app"
          git add -f gradle-output.txt || true
          if git diff --cached --quiet; then echo "no diagnostics to commit"; else
            git commit -m "ci: gradle diagnostics [skip ci]"
            git push origin HEAD:main
          fi

      - name: Verify signed APK
        run: |
          APK=$(find android -name "*.apk" -path "*release*" | head -1)
          test -n "$APK" || { echo "ERROR: no release APK produced"; exit 1; }
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          unzip -l "$APK" | grep -E "classes.dex|resources.arsc|META-INF/.*\.(RSA|SF)" || { echo "ERROR: APK missing dex/resources/signature"; exit 1; }

      - name: Bundle release APK for Vercel
        run: |
          mkdir -p public/releases
          APK=$(find android -name "*.apk" -path "*release*" | head -1)
          cp "$APK" public/releases/pulmowave-release.apk
          ls -lh public/releases/

      - name: Commit signed APK back to repo (served by Vercel)
        run: |
          git config user.name "pulmo-wave-ci"
          git config user.email "ci@pulmowave.app"
          git add public/releases/pulmowave-release.apk
          if git diff --cached --quiet; then echo "APK unchanged — nothing to commit"; else
            git commit -m "ci: bundle signed PulmoWave v1.0.0 APK ($(du -h public/releases/pulmowave-release.apk | cut -f1)) [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulmowave-release-apk
          path: public/releases/
