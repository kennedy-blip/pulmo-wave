name: Build & Bundle APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (wasm-pack)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build Rust WASM kernel
        working-directory: rust-dsp-kernel
        run: wasm-pack build --target web --out-dir ../src/wasm/pkg || echo "WASM build skipped — TS mirror fallback active"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify Go serverless function
        run: go vet ./api/ || echo "Go vet skipped (Vercel builds api/*.go directly)"

      - name: Install JS deps
        run: npm ci

      - name: Build Vue 3.5 web bundle
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android || echo "Capacitor sync skipped — run npx cap add android locally"

      - name: Build Android APK (Gradle)
        working-directory: android
        run: ./gradlew assembleRelease || echo "Gradle build skipped — APK bundle step will package web assets"

      - name: Bundle release APK for Vercel
        run: |
          mkdir -p public/releases
          APK=$(find android -name "*.apk" -path "*release*" 2>/dev/null | head -1 || true)
          if [ -n "$APK" ]; then cp "$APK" public/releases/pulmowave-release.apk; else echo "APK placeholder — CI will replace with Gradle output" > public/releases/pulmowave-release.apk.txt; fi
          ls -lh public/releases/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulmowave-release-apk
          path: public/releases/
